<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お支払いキャンセル - 野菜認識アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cancel-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }
        .cancel-icon {
            font-size: 80px;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
        }
    </style>
</head>
<body>
    <div class="cancel-card">
        <div class="cancel-icon">
            <i class="fas fa-times-circle"></i>
        </div>

        <h2 class="mb-4">お支払いがキャンセルされました</h2>

        <p class="lead mb-4">
            お支払いの処理がキャンセルされました。<br>
            引き続き無料プランでご利用いただけます。
        </p>

        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i> いつでもプレミアム会員にアップグレードできます
        </div>

        <div class="mt-4">
            <a href="{{ url_for('upload_file') }}" class="btn btn-secondary btn-lg me-2">
                <i class="fas fa-home"></i> ホームに戻る
            </a>
            <a href="{{ url_for('payment.pricing') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-crown"></i> プランを見る
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
